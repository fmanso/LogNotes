name: GUI scenario

# The scripted window run is the only check that exercises the real input path — typing, links,
# search, the slash menu, rename/delete, folding and restore. It needs a window server, so it runs
# under Xvfb on a schedule rather than blocking every pull request. Promote it to blocking (remove
# `continue-on-error`) after a stable streak.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: '6.8.3'

jobs:
  livetest:
    name: Window scenario
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Qt
        run: |
          python3 -m pip install --user aqtinstall
          python3 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/Qt"
          echo "QTDIR=$HOME/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
          echo "$HOME/Qt/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/Qt/$QT_VERSION/gcc_64/lib" >> "$GITHUB_ENV"

      - name: A C++ toolchain, the GL headers, and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgl1-mesa-dev xvfb libxcb-cursor0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - uses: Swatinem/rust-cache@v2

      - name: Qt plugin dependencies
        run: |
          find "$QTDIR/plugins/platforms" -name 'libqxcb.so' -print -exec ldd {} \; \
            | grep -E 'not found|libxcb|libxkb' || true
          dpkg -l | grep -E 'libxcb-cursor|libxkbcommon-x11' || true

      - name: Drive the window
        env:
          QT_QUICK_BACKEND: software
          QSG_RENDER_LOOP: basic
          TMPDIR: ${{ runner.temp }}
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            cargo run -p lognotes-qt --features driver -- --livetest

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livetest-screenshots
          path: ${{ runner.temp }}/lognotes-livetest
          if-no-files-found: warn
