name: Release

# Pushing a tag publishes it: both platforms are built by the CI workflow, and the artifacts become the
# release's downloads.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (it must already exist)'
        required: true

permissions:
  contents: write

jobs:
  # Fail before either platform is built when the tag and the package disagree. The tag push is the
  # normal path; a workflow_dispatch checks out the tag it names, while the reusable build below still
  # uses the default branch (so the tag and that branch must hold the same version).
  version:
    name: Version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Tag matches Cargo.toml
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="$TAG"
          test "$tag" = "v$version" || {
            echo "Tag $tag does not match package version $version (expected v$version)"
            exit 1
          }
          echo "$tag matches package version $version"

  build:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "LogNotes $TAG" \
            --generate-notes
