name: Release

# Pushing a tag publishes it: both platforms are built by the CI workflow, and the artifacts become the
# release's downloads.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (it must already exist)'
        required: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "LogNotes $TAG" \
            --generate-notes
