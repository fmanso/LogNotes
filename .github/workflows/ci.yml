name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: '6.8.3'

jobs:
  # The platform this is developed on: every unit test, then the packaged release.
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Qt comes from the Qt project rather than the distribution: both jobs then build against the same
      # version, and neither depends on what a distro happens to ship.
      - name: Qt
        run: |
          python3 -m pip install --user aqtinstall
          # No -m: for Qt 6 the base package already carries Qt Declarative and Qt SVG.
          python3 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/Qt"
          echo "QTDIR=$HOME/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
          echo "$HOME/Qt/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"

      - name: A C++ toolchain and the GL headers Qt Quick links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --workspace --jobs 2

      - name: Package
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: lognotes-linux
          path: dist/*.tar.gz

  # The platform with no machine behind it here: this job is also the check that the code builds on Windows.
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 `
            -O "$env:RUNNER_TEMP\Qt"
          $qtdir = "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64"
          echo "QTDIR=$qtdir" >> $env:GITHUB_ENV
          echo "$qtdir\bin" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p lognotes-qt --jobs 2

      - name: Package
        shell: pwsh
        run: ./packaging/windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: lognotes-windows
          path: dist/*.zip
